name: tradegenius
description: "TradeGenius - Advanced Crypto Trading & Analysis Platform with AI-powered insights"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_sign_in: ^7.1.0
  local_auth: ^3.0.0
  cupertino_icons: ^1.0.8
  go_router: ^16.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  file_picker: ^8.0.0
  permission_handler: ^11.0.0
  device_info_plus: ^10.0.0
  audioplayers: ^6.0.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/onboarding/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/splash-logo.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icons/splash-logo.png"
