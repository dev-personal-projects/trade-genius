name: tradegenius
description: "tradegenius is a stock trading app that helps users make informed trading decisions."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_sign_in: ^7.1.0
  local_auth: ^2.3.0
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  shared_preferences: ^2.2.2
  http: ^1.2.0
  web_socket_channel: ^3.0.0





  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/onboarding/

  